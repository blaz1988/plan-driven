name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: RuboCop
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
        rails: ['7.0', '7.1', '7.2', '8.0', '8.1']
        exclude:
          # Rails 8 requires Ruby 3.2+.
          - { ruby: '3.1', rails: '8.0' }
          - { ruby: '3.1', rails: '8.1' }
          # Rails 7.0/7.1 predate Ruby 3.4 and do not load on it.
          - { ruby: '3.4', rails: '7.0' }
          - { ruby: '3.4', rails: '7.1' }

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
